<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Doctor Profile</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            min-height: 100vh;
        }

        .container {
            max-width: 750px;
            margin: 50px auto;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .title {
            text-align: center;
            margin-bottom: 30px;
        }

        .title h1 {
            color: #1e293b;
            margin-bottom: 8px;
        }

        .title p {
            color: #64748b;
        }

        .profile-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .profile-photo {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #e2e8f0;
            margin-bottom: 15px;
        }

        .no-photo {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 55px;
            color: #64748b;
        }

        .upload-box {
            border: 2px dashed #cbd5e1;
            padding: 25px;
            border-radius: 12px;
            background: #f8fafc;
            margin-bottom: 25px;
        }

        .upload-box label {
            display: block;
            font-weight: bold;
            color: #334155;
            margin-bottom: 12px;
        }

        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: white;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-bottom: 25px;
        }

        .field label {
            display: block;
            font-weight: bold;
            color: #475569;
            margin-bottom: 7px;
        }

        .field input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
        }

        .field input:focus {
            border-color: #2563eb;
        }

        .buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn {
            border: none;
            padding: 13px 25px;
            border-radius: 9px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }

        .save {
            background: #2563eb;
            color: white;
        }

        .save:hover {
            background: #1d4ed8;
        }

        .cancel {
            background: #e2e8f0;
            color: #334155;
        }

        .cancel:hover {
            background: #cbd5e1;
        }

        .message {
            padding: 12px;
            background: #dcfce7;
            color: #166534;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        @media (max-width: 600px) {
            .container {
                margin: 20px auto;
            }

            .card {
                padding: 22px;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="title">
            <h1>Doctor Profile</h1>
            <p>Change your profile information and photo</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="message">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="profile-section">

                {% if doctor.profile_image %}
                    <img
                        src="{{ doctor.profile_image.url }}"
                        class="profile-photo"
                        alt="Doctor Profile"
                    >
                {% else %}
                    <div class="no-photo">
                        👨‍⚕️
                    </div>
                {% endif %}

                <div class="upload-box">
                    <label for="profile_image">
                        📷 Change Profile Photo
                    </label>

                    <input
                        type="file"
                        name="profile_image"
                        id="profile_image"
                        accept="image/*"
                    >
                </div>

            </div>

            <div class="info-grid">

                <div class="field">
                    <label>Doctor Name</label>
                    <input
                        type="text"
                        name="name"
                        value="{{ doctor.name }}"
                        required
                    >
                </div>

                <div class="field">
                    <label>Email</label>
                    <input
                        type="email"
                        name="email"
                        value="{{ doctor.email }}"
                        required
                    >
                </div>

                <div class="field">
                    <label>Phone</label>
                    <input
                        type="text"
                        name="phone"
                        value="{{ doctor.phone }}"
                        required
                    >
                </div>

                <div class="field">
                    <label>Specialization</label>
                    <input
                        type="text"
                        name="specialization"
                        value="{{ doctor.specialization }}"
                        required
                    >
                </div>

                <div class="field">
                    <label>Qualification</label>
                    <input
                        type="text"
                        name="qualification"
                        value="{{ doctor.qualification }}"
                    >
                </div>

                <div class="field">
                    <label>Experience</label>
                    <input
                        type="number"
                        name="experience"
                        value="{{ doctor.experience }}"
                        min="0"
                    >
                </div>

            </div>

            <div class="buttons">

                <button type="submit" class="btn save">
                    💾 Save Changes
                </button>

                <a href="{% url 'doctor_dashboard' %}" class="btn cancel">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
